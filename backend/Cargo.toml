[package]
name = "stino-backend"
version = "0.1.0"
edition = "2021"
description = "Stinō — self-hosted TickTick replacement (backend)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
# Drive the router in-process for integration tests (Service::oneshot) and read
# response bodies, without binding a TCP port.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
