services:
  stino:
    build: .
    container_name: stino
    ports:
      # Publishes on every host interface. If the host has a LAN-facing NIC,
      # tighten this to "127.0.0.1:8080:8080" and front it with `tailscale serve`
      # (or bind the Tailscale IP directly) so only the tailnet can reach it.
      - "8080:8080"
    volumes:
      # SQLite database lives here so it survives container/image rebuilds.
      - ./data:/data
    environment:
      DATA_DIR: /data
      STATIC_DIR: /app/static
      PORT: "8080"
      # Optional DNS-rebinding guard: when set, requests whose Host header isn't
      # in this comma-separated list are rejected with 403.
      # ALLOWED_HOSTS: stino.tailnet-name.ts.net
    restart: unless-stopped
