services:
  stino:
    build: .
    container_name: stino
    ports:
      # Bind to localhost or the Tailscale address when LAN exposure is undesired.
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      DATA_DIR: /data
      STATIC_DIR: /app/static
      PORT: "8080"
      # Optional comma-separated Host allowlist.
      # ALLOWED_HOSTS: stino.tailnet-name.ts.net
    restart: unless-stopped

  # Rebuilds leave dangling images and build cache behind that fill the host disk.
  docker-prune:
    image: docker:cli
    container_name: stino-docker-prune
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          docker image prune -af --filter until=168h
          docker builder prune -af --filter until=336h
          sleep 604800
        done
    restart: unless-stopped
