<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply a saved Light/Dark override before first paint to avoid a flash;
      // "system" (or none) falls through to the prefers-color-scheme CSS. Keep the
      // storage key in sync with src/lib/theme.ts.
      try {
        var t = localStorage.getItem('stino-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {
        /* storage unavailable — fall back to system */
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Mobile browser UI bar: pine in light, the dark app surface at night. -->
    <meta name="theme-color" content="#2F5D50" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17211C" media="(prefers-color-scheme: dark)" />
    <title>Stinō</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
